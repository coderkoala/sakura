# Sakura's local metasearch. Listens on localhost only, for one user, so it has no limiter.
# The secret key comes from SEARXNG_SECRET, generated on each machine by sakura-web-setup.
use_default_settings: true
general:
  instance_name: "sakura"
server:
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json
# The general engines that answer an ordinary home connection, and none of the ones that challenge it.
engines:
  - {name: mojeek, disabled: false}
  - {name: startpage, disabled: false}
  - {name: presearch, disabled: false}
  - {name: yahoo, disabled: false}
  - {name: yandex, disabled: false}
  - {name: github, disabled: false}
  - {name: stackoverflow, disabled: false}
  - {name: duckduckgo, disabled: true}
  - {name: brave, disabled: true}
  - {name: qwant, disabled: true}
  - {name: google, disabled: true}
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
