# Builds the engine for every place Sakura runs: x86_64 against glibc, x86_64 static (any glibc, however old) and ARM64 static.
# Run by hand (Actions → engine → Run workflow); it never runs by itself. The assets land on the run, and on the release
# when a tag is given. tools/build-engine.sh does the work, so a build here is the build you'd get at home.
name: engine
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the assets to this release tag (e.g. v1.0.0); empty: keep them on the run only"
        required: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools for a static build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools pkg-config libssl-dev
      - name: Build
        env:
          SAKURA_BUILD_JOBS: "2"
        run: tools/build-engine.sh ${{ matrix.target }} dist
      - name: It runs
        run: |
          mkdir t && tar -xzf dist/*.tar.gz -C t && t/sakura --version
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: dist/*
      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
