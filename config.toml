# Sakura (the Rust fork of Codex), configured to run fully local and autonomous.
# Symlinked to ~/.sakura/config.toml by modules/77-sakura.sh.
# Every key here is verified against codex-rs source: the parser rejects unknown keys outright.

model_provider = "local-ollama"
# Tiered: a FAST generalist answers by default; it hands hard subtasks to the expert via the spawn_agent tool
# (see [agents] + AGENTS.md). On 8 GB: generalist = 2b (instant), expert = 9b. Scaling up hardware = bump both ids.
model = "huihui_ai/qwen3.5-abliterated:9b"   # reliable generalist on 8 GB (2b guessed wrong tool names); /model switches mid-session
model_context_window = 32768                  # start Ollama with OLLAMA_CONTEXT_LENGTH=32768 to match
model_auto_compact_token_limit = 26000
# codex-rs ships no metadata for these Ollama slugs, so without a catalog it warns at startup
# ("Model metadata not found … degrade performance") and assumes a 272k context window. models.json
# states the real metadata (context 32768) and carries Sakura's own base prompt (prompts/base.md)
# so the warning is gone. Regenerate after editing the prompt: tools/gen-model-catalog.py. __SAKURA_DIR__
# is rewritten to this repo's absolute path by modules/77-sakura.sh.
model_catalog_json = "__SAKURA_DIR__/models.json"
harness = "qwen-code"                          # the message/tool shape this model was trained for
sandbox_mode = "danger-full-access"            # no sandbox: commands run on the real machine. The approval
                                               # gate (below) is what holds them back, not a container.
web_search = "disabled"                        # nothing leaves the machine but the model calls and your ssh
check_for_update_on_startup = false

[model_providers.local-ollama]
name = "Ollama (local)"
base_url = "http://127.0.0.1:11434/v1"
wire_api = "chat"                              # chat, not responses: the chat harnesses need it

# No OpenAI/ChatGPT/Codex upsell tips. The upstream TUI rotates "Try the Desktop app"
# (chatgpt.com), "/fast for our fastest inference", GPT-model promos and the like through
# the welcome/footer tip slots; none of that belongs in a local uncensored agent. Turning
# tooltips off disables the whole subsystem. (The openai.com announcement fetch is already
# dead in this fork — lib.rs "[oi-fork] no network at startup".)
[tui]
show_tooltips = false

# q approves, w is "no - do this instead" (declines and hands your correction back to the model).
# The approval overlay shares the list keymap, which owns plain j/k (move_down/move_up); using q/w here
# keeps vim j/k navigation working and avoids the "ambiguous keymap" conflict. y/a/p/esc/n/d still work.
[tui.keymap.approval]
approve = ["y", "q"]
decline = ["esc", "n", "w"]

# Long-term memory is bin/sakura-memory, loaded by hooks/session_context.py. The engine's own pipeline wrote nothing
# in 449 sessions, so it's off.
[memories]
use_memories = false
generate_memories = false

# Silence every outbound call that is not the model: metrics, update checks, feedback.
[analytics]
enabled = false

[otel]
exporter = "none"

[feedback]
enabled = false

# Tiering: the generalist (top-level `model`) can delegate a hard subtask to a stronger model with the spawn_agent
# tool; default_subagent_model is the "muscle". On bigger hardware raise both this and `model` to larger Ollama tags.
# The agent tools are off: the local model serves one request at a time. Separate jobs go through bin/sakura-worker.
[features]
multi_agent_v2 = false

# ── Live web knowledge (cited) ────────────────────────────────────────────────
# The native `web_search` above is a hosted tool that never fires over local Ollama, so it stays off.
# Instead, sakura-web is a zero-dependency stdlib MCP server (mcp/sakura-web/server.py) giving the model
# three tools — web_search (DuckDuckGo, no key), fetch_url, and wikipedia — each returning source URLs so
# answers can be cited. The kb and research-analyst skills tell the model to use these for anything
# time-sensitive instead of answering from stale training data.
# __SAKURA_DIR__ is rewritten to this repo's absolute path by modules/77-sakura.sh at install time.
[mcp_servers.sakura-web]
command = "python3"
args = ["-u", "__SAKURA_DIR__/mcp/sakura-web/server.py"]
